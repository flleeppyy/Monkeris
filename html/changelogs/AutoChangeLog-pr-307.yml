author: Sun-Soaked
delete-after: true
changes:
  - rscadd: mining satchels now attempt to collect all ore from adjacent tiles 
      as well as the targeted one, speeding up ore collection
  - rscadd: the mining turret now can be picked up inhand by click dragging, 
      then deployed from inhand. the mining turrets on the mining shuttle now 
      start folded, on a rack, with a wrench beside them.
  - bugfix: onestar turrets now properly display their broken state
  - bugfix: rogue mining turrets now spawn enabled.
  - balance: the mining turret has somewhat more hp
  - balance: the OS turret now has standard hp
  - balance: unwrenching turrets now takes less time.
